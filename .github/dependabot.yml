version: 2
updates:
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      svelte:
        patterns:
          - 'svelte'
          - '@sveltejs/*'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
      biome:
        patterns:
          - '@biomejs/*'
      test:
        patterns:
          - 'svelte-check'
      tooling:
        patterns:
          - 'vite'
          - 'typescript'
          - 'lefthook'
          - '@types/node'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
