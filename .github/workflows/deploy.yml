name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-releases:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.releases.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - name: Restore data cache
        uses: actions/cache/restore@v6
        id: data-cache
        with:
          path: src/data/proton.json
          key: proton-data
          restore-keys: |
            proton-data-
      - uses: oven-sh/setup-bun@v2
      - name: Check release feeds
        id: releases
        run: |
          if bun run check-releases | grep -q UPDATE; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-releases
    if: always() && (github.event_name != 'schedule' || needs.check-releases.outputs.changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore data cache
        uses: actions/cache/restore@v6
        id: data-cache
        with:
          path: src/data/proton.json
          key: proton-data
          restore-keys: |
            proton-data-
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Scrape
        run: bun run scrape
      - name: Lint & format check
        run: bun run check
      - name: Sync SvelteKit
        run: bunx svelte-kit sync
      - name: Save data cache
        uses: actions/cache/save@v6
        with:
          path: src/data/proton.json
          key: proton-data-${{ github.run_id }}
      - name: Build
        env:
          BASE_PATH: /proton-variants
        run: bun run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
