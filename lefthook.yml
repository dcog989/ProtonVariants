pre-commit:
  parallel: true
  commands:
    check:
      glob: "*.{ts,js,svelte}"
      run: bun run check
      stage_fixed: true

commit-msg:
  commands:
    cocogitto:
      run: cog verify --file {1}

pre-push:
  parallel: false
  commands:
    01_scrape:
      run: bun run scrape
    02_build:
      run: bun run build
